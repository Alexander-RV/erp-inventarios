services:
  - type: web
    name: erp-inventarios
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.2
      - key: DATABASE_URL
        fromDatabase:
          name: erp-db
          property: connectionString
databases:
  - name: erp-db
    plan: free
    databaseName: erp
